<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>크리스마스 카드 메이커 - 내 사진과 편지로 만드는 크리스마스 포토카드</title>
  <meta name="description" content="크리스마스 카드 메이커 - 내 사진과 편지로 만드는 크리스마스 포토카드" />
  <meta property="og:title" content="크리스마스 카드 메이커" />
  <meta property="og:description" content="내 사진과 편지로 만드는 크리스마스 포토카드" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dongle:wght@400;700&family=Gaegu:wght@400;700&family=Gowun+Batang&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./script.js"></script>
</head>
<body>

<!-- Header Navigation Bar -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand-zone">
      <span class="tree-icon" aria-hidden="true">🎄</span>
      <div class="brand-text-col">
        <h1 class="header-title">크리스마스 카드 메이커</h1>
        <span class="header-tagline">내 사진과 편지로 만드는 크리스마스 포토카드</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-header" data-a="download-code-modal" title="오늘 완성된 전체 소스코드 다운로드">
        <span>📦</span><span>코드 다운로드</span>
      </button>
      <button type="button" class="btn-header" data-a="slink">
        <span>🔗</span><span>링크 공유</span>
      </button>
      <button type="button" class="btn-header primary" data-a="save">
        <span>💾</span><span>4×6 사진 저장</span>
      </button>
    </div>
  </div>
</header>

<!-- Main Workspace App -->
<div class="app-container">
  <div id="ban">친구가 보낸 카드예요! 내 얼굴을 넣어 답장해 보세요 🎁</div>

  <!-- Left Column: Real-time Live Preview Card -->
  <section class="preview-card-box">
    <div class="box-header">
      <div class="box-header-title">
        <span class="live-dot"></span>
        <span>실시간 카드 미리보기</span>
      </div>
      <span class="box-header-sub">우측에서 수정 시 즉시 반영</span>
    </div>

    <!-- Preview Canvas Display Area: Full 4x6 Postcard (Landscape 3:2 ratio) -->
    <div class="canvas-view-stage">
      <div class="cvw" id="cvw">
        <canvas id="cv" width="1800" height="1200"></canvas>
        <!-- On-object floating action toolbar (확대, 축소, 좌/우 회전, 삭제 - 아이콘 전용) -->
        <div id="obj-floating-toolbar" class="obj-floating-toolbar" style="display:none">
          <button type="button" data-act="zoom-in" title="크기 확대" aria-label="확대"><span>➕</span></button>
          <button type="button" data-act="zoom-out" title="크기 축소" aria-label="축소"><span>➖</span></button>
          <button type="button" data-act="rotate-left" title="좌측 15도 회전" aria-label="좌측 회전"><span>⟲</span></button>
          <button type="button" data-act="rotate" title="우측 15도 회전" aria-label="우측 회전"><span>⟳</span></button>
          <button type="button" data-act="flip" title="좌우 반전" aria-label="반전"><span>⇋</span></button>
          <button type="button" data-act="delete" class="del-btn" title="오브젝트 삭제" aria-label="삭제"><span>🗑️</span></button>
        </div>
      </div>
    </div>

    <!-- Preview Info Strip -->
    <div class="preview-spec-row">
      <span class="spec-badge-gold">4×6 (10×15cm) 인쇄 최적화 규격</span>
      <span class="spec-badge-sub" id="mode-badge-txt">4×6 완성 엽서 실시간 편집</span>
      <span class="spec-badge-sub">300 DPI 초고화질</span>
    </div>

    <!-- Quick Tools for selected item - hidden as requested (replaced by on-object floating controls) -->
    <div class="tools" id="tools" style="display:none">
      <button type="button" class="b" data-a="z+" aria-label="확대">＋ 확대</button>
      <button type="button" class="b" data-a="z-" aria-label="축소">－ 축소</button>
      <button type="button" class="b" data-a="rot" aria-label="시계방향 회전">⟳ 회전</button>
      <button type="button" class="b" data-a="rot-ccw" aria-label="반시계방향 회전">⟲ 역회전</button>
      <button type="button" class="b" data-a="flip" aria-label="좌우반전">⇋ 반전</button>
      <button type="button" class="b" data-a="layer-up" aria-label="맨 앞으로">🔝 맨앞으로</button>
      <button type="button" class="b" data-a="layer-down" aria-label="뒤로">⤓ 뒤로</button>
      <button type="button" class="b del" data-a="del" aria-label="삭제">🗑 삭제</button>
      <button type="button" class="b" data-a="reset-default-card">✨ 기본세트 복원</button>
    </div>
    <div class="note" id="hint">손가락이나 마우스로 요소와 스티커를 끌어서 원하는 위치에 놓을 수 있어요. 선택 시 바로 위에 확대·축소·삭제 메뉴가 나타납니다.</div>

    <!-- Hidden standalone full-preview container for backward compatibility -->
    <div id="pvw" style="display:none"></div>
  </section>

  <!-- Right Column: Editor Box -->
  <section class="editor-card-box mode-let" id="panel-container">
    <!-- Top 2 Main Segmented Mode Tabs: 그림 편집 vs 편지쓰기 -->
    <div class="main-mode-tabs mode-let" id="main-mode-tabs">
      <button type="button" class="main-mode-btn" data-mode="edit"><span class="tab-ico">🎨</span><span>그림 편집</span></button>
      <button type="button" class="main-mode-btn on" data-mode="let"><span class="tab-ico">💌</span><span>편지쓰기</span></button>
    </div>

    <!-- Sub Navigation Tabs Bar (Icons + Labels) -->
    <div class="sub-tabs-bar" id="tabs"></div>

    <!-- Active Panel Content -->
    <div class="panel-content-body" id="pn"></div>
  </section>
</div>

<!-- Modal dialogs -->
<dialog id="dlg">
  <div id="dc"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px">
    <button type="button" class="b g" data-a="save">💾 4×6 저장</button>
    <button type="button" class="b" data-a="close">닫기</button>
  </div>
</dialog>

<dialog id="cdlg">
  <video id="vid" playsinline muted autoplay></video>
  <div class="row" style="margin-top:12px;justify-content:center;gap:10px">
    <button type="button" class="b g" data-a="snap" style="min-height:44px;font-size:15px;padding:0 20px">📸 찰칵!</button>
    <button type="button" class="b" data-a="camclose" style="min-height:44px;font-size:15px">취소</button>
  </div>
  <p class="note" style="text-align:center">얼굴이 화면 가운데에 오도록 맞춰 주세요. 밝은 곳에서 찍으면 더 예쁘게 나와요.</p>
</dialog>

<div id="toast"></div>

</body>
</html>
