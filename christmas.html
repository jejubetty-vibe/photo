<html lang="ko"><head><meta charset="utf-8"><title>크리스마스 카드 메이커</title>

html,body{height:auto}*{box-sizing:border-box}

h1{font-size:22px;margin:0;padding:10px 14px 0;color:var(--red)}
.app{display:grid;gap:12px;max-width:1100px;margin:auto;padding:8px 12px 28px}
@media(min-width:860px){.app{grid-template-columns:minmax(380px,500px) 1fr;align-items:start}.stage{position:sticky;top:8px}}
.cvw{width:min(100%,calc(50vh*3/4));margin:auto}
@media(min-width:860px){.cvw{width:100%}}
#cv{width:100%;display:block;touch-action:none;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);background:#fff}
.tools{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.b{min-height:44px;min-width:44px;border:0;border-radius:12px;padding:0 14px;font:inherit;font-size:15px;background:var(--red);color:#fff;cursor:pointer;touch-action:manipulation}
.b.s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.b.g{background:var(--grn)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.tab{min-height:42px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:21px;padding:0 12px;font:inherit;font-size:15px;touch-action:manipulation}
.tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px}

.it small{font-size:12px}.it img,.it canvas{width:56px;height:56px;border-radius:8px}
.it.on{outline:3px solid var(--grn)}
.wide{grid-column:1/-1}.tpl{font-size:15px;min-height:76px}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mut)}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:190px;font-family:'Gaegu',sans-serif;font-size:19px;line-height:1.4}
input[type=range]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .tab{min-height:38px}
.big{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--ink);background:var(--bg);border:2px solid var(--grn);border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer}.big input{width:28px;height:28px;flex:none}.big small{display:block;font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin:8px 0}
#vid{width:100%;max-height:60vh;display:block;border-radius:10px;background:#000;transform:scaleX(-1);object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#fp{width:120px;border-radius:10px;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px;display:block;margin:8px 0}
dialog{border:0;border-radius:16px;padding:12px;max-width:min(94vw,760px);background:var(--card);color:var(--ink)}
dialog canvas{width:100%;display:block;border-radius:8px}

#ban{display:none;background:var(--grn);color:#fff;padding:10px 14px;border-radius:12px}
#pimg{display:none}
@media print{body>*:not(#pimg){display:none!important}#pimg{display:block;width:6in;height:4in}@page{size:6in 4in;margin:0}:root{padding:0}}

if(t=='photo')h=`<p class="note">🔒 사진은 이 기기의 브라우저 안에서만 처리돼요. 서버로 업로드·저장되지 않으므로 AI 학습에도 쓰이지 않아요. 창을 닫으면 사라져요.</p>
<input type="file" id="ph" accept="image/*" hidden><input type="file" id="ph2" accept="image/*" capture="user" hidden><div class="row"><button class="b" data-a="cam">📷 사진 찍기</button><button class="b s" data-a="pick">🖼 앨범에서 고르기</button></div>
<canvas id="fp" width="360" height="440"></canvas>
<label><input type="checkbox" id="rb"> 배경 자동 제거 (투명)</label><label>제거 민감도</label><input type="range" id="sn" min="20" max="120" value="60">
<label><input type="checkbox" id="ov"> 얼굴만 타원으로 자르기</label><label>확대</label><input type="range" id="zm" min="1" max="2.5" step=".05" value="1.2"><label>위아래 위치</label><input type="range" id="yp" min="-.3" max=".3" step=".01" value="0">
<div class="row"><button class="b g" data-a="face">액자에 사진 넣기</button><button class="b s" data-a="noface">사진 없이 꾸미기</button></div>
<p class="note">배경이 단색에 가까울수록 깔끔하게 지워져요. 남으면 민감도를 올려 보세요.</p>`;
if(t=='frame')h='<div class="grid">'+FRM.map((f,i)=>`<button class="it ${i==S.frame?'on':''}" data-a="frm" data-v="${i}"><img src="${fth(i)}" alt=""><small>${f.n}</small></button>`).join('')+'</div><p class="note">액자를 고르면 화면에 바로 나타나요. 사진은 [📸 내 사진] 탭에서 찍거나 고르면 액자 안에 들어가요.</p>';
if(t=='body')h='<div class="grid">'+BODIES.map((b,i)=>`<button class="it" data-a="body" data-v="${i}"><img src="${thumb(i)}" alt=""><small>${b.n}</small></button>`).join('')+'<button class="it" data-a="nobody"><span>🚫</span><small>없음</small></button></div><input type="file" id="up" accept="image/*" hidden><div class="row"><button class="b s" data-a="upl">📁 내 이미지 추가</button></div><label><input type="checkbox" id="ib"> 추가한 이미지 배경 자동 제거</label><p class="note">고화질 캐릭터·일러스트 PNG(투명 배경 추천)를 올려 카드에 쓸 수 있어요. 이미지는 서버로 전송되지 않고, 공유 링크에는 포함되지 않아요.</p>';
if(t=='bg')h='<div class="grid">'+BGS.map((b,i)=>`<button class="it ${i==S.bg?'on':''}" data-a="bg" data-v="${i}"><img src="${bgThumb(i)}" alt=""><small>${b.n}</small></button>`).join('')+'</div>';
if(t=='st')h='<div class="grid">'+EM.map((e,i)=>`<button class="it" data-a="st" data-v="${i}">${e}</button>`).join('')+'</div><label>글자 스티커</label><div class="chips">'+TXT.map((x,i)=>`<button class="tab" data-a="tx" data-v="${i}">${x}</button>`).join('')+'</div><input type="file" id="up" accept="image/*" hidden><div class="row"><button class="b s" data-a="upl">📁 내 이미지 추가</button></div><label><input type="checkbox" id="ib"> 추가한 이미지 배경 자동 제거</label><p class="note">일러스트 PNG(투명 배경 추천)를 올려 스티커처럼 쓸 수 있어요. 서버로 전송되지 않고, 공유 링크에는 포함되지 않아요.</p>';
if(t=='flt')h='<div class="chips">'+FIL.map((f,i)=>`<button class="tab ${i==S.filter?'on':''}" data-a="flt" data-v="${i}">${f[0]}</button>`).join('')+'</div>'+(CF?'':'<p class="note">이 브라우저는 저장 이미지에 필터가 적용되지 않을 수 있어요.</p>');
if(t=='let')h=`<label class="big"><input type="checkbox" id="nol" ${S.noL?'checked':''}><span>✉️ 편지 없이 카드만 만들기<small>체크하면 카드 오른쪽에 인사말만 들어가요</small></span></label><label>보내는 사람</label><input type="text" id="fr" value="${S.from}" placeholder="예: 지은" maxlength="20"><div style="margin-top:6px;${S.noL?'opacity:.4;pointer-events:none':''}"><label>누구에게 쓸까요?</label><div class="chips">${[1,2,0].map(i=>`<button class="tab ${i==S.kind?'on':''}" data-a="kind" data-v="${i}">${KINDS[i]}</button>`).join('')}</div><label>받는 사람 이름</label><input type="text" id="to" value="${S.to}" placeholder="${['이름을 입력하세요 (예: 민수)','비워 두면 산타 할아버지께','비워 두면 엄마 아빠께'][S.kind]}" maxlength="20">
<label>느낌</label>${chips(MOODS,S.mood,'mood')}<label>전하고 싶은 메시지</label>${chips(TK[S.kind],S.topic,'topic')}<label>편지 (직접 고칠 수 있어요)</label><textarea id="lt">${S.letter}</textarea></div>
<div class="row"><button class="b s" data-a="re">🎲 다시 쓰기</button><button class="b g" data-a="prev">카드 미리보기</button></div>`;
if(t=='out')h=`<div class="row"><button class="b g" data-a="prev">카드 미리보기</button><button class="b" data-a="save">⬇ 4×6 사진 저장</button><button class="b" data-a="print">🖨 포토프린터 인쇄</button></div>
<div class="row"><button class="b" data-a="slink">🔗 링크로 친구에게 보내기</button><button class="b s" data-a="simg">🖼 이미지로 공유</button></div><label>공유 링크</label><input type="text" id="lk" readonly><p class="note">링크에는 배경·캐릭터·스티커·편지가 담겨요. 얼굴 사진은 개인정보 보호를 위해 링크에 포함되지 않으니, 얼굴이 담긴 카드는 이미지로 공유해 주세요. 인쇄 용지는 4×6인치(1800×1200px)로 만들어져요.</p>`;
p.innerHTML=h;$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab ${k==t?'on':''}" data-t="${k}">${n}</button>`).join('');
if(t=='st')$('#up').onchange=e=>addImg(e.target.files[0]);
if(t=='out')$('#lk').value=link();
if(t=='photo'){$('#ph').onchange=e=>loadPhoto(e.target.files[0]);$('#ph2').onchange=e=>loadPhoto(e.target.files[0]);['rb','sn','ov','zm','yp'].forEach(i=>$('#'+i).oninput=buildFace);if(RAW)buildFace()}
if(t=='let'){$('#nol').onchange=e=>{S.noL=e.target.checked?1:0;panel();pvUpd()};$('#to').oninput=e=>{S.to=e.target.value;gen();$('#lt').value=S.letter;lpUpd()};$('#fr').oninput=e=>{S.from=e.target.value;lpUpd()};$('#lt').oninput=e=>{S.letter=e.target.value;lpUpd()};lpUpd()}}
document.addEventListener('click',e=>{const w=e.target.closest('[data-v2]');if(w){setView(w.dataset.v2);return}const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;panel();setView(['photo','frame','bg','st','flt'].includes(S.tab)?'edit':'prev');return}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=+b.dataset.v;
const M={tpl(){applyTpl(v);panel()},cam:openCam,pick(){$('#ph').click()},snap,camclose:closeCam,face:useFace,frm(){S.frame=v;placeFace();panel()},noface(){S.face=null;S.items=S.items.filter(i=>i.t!='f');S.tab='st';panel();setView('edit');toast('캐릭터나 스티커로 자유롭게 꾸며 보세요')},
body(){setBody(v)},upl(){$('#up').click()},nobody(){S.items=S.items.filter(i=>i.t!='b')},bg(){S.bg=v;panel()},st(){const n=mk('s',{e:EM[v],s:1.2});S.items.push(n);S.sel=n},tx(){const n=mk('x',{txt:TXT[v],s:1.2,y:300});S.items.push(n);S.sel=n},
flt(){S.filter=v;panel()},to(){S.to=RC[v];gen();panel()},fr(){S.from=SD[v];panel()},kind(){S.kind=v;S.topic=0;gen();panel()},mood(){S.mood=v;gen();panel()},topic(){S.topic=v;gen();panel()},re(){S.seed=S.seed.map(x=>x+1);gen();panel()},
print,slink:shareLink,simg:shareImg,save};
if(M[a]){M[a]();paint()}else act(a)});
// ---- init
const shared=loadHash();if(!shared){applyTpl(0);S.items=[mk('s',{e:'🎄',x:160,y:1040,s:1.3}),mk('s',{e:'⭐',x:760,y:150,s:1.2}),mk('s',{e:'❄️',x:150,y:150,s:1})];placeFace();S.sel=null;gen()}else $('#ban').style.display='block';
panel();paint();
setView('prev');Promise.all([document.fonts.load('40px Jua'),document.fonts.load('700 40px Gaegu')]).then(paint).catch(()=>{});
</script></body></html>
